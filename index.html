<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/startup/wave.css" />
    <link rel="stylesheet" href="/startup/loading.css" />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app-loading" role="status">
<div class="startup-content">
  <div class="np-wave" aria-hidden="true">
  <div class="np-wave__glow"></div>
  <svg
    class="np-wave__ocean"
    viewBox="0 0 240 100"
    preserveAspectRatio="none"
    fill="none"
    focusable="false"
  >
    <g class="np-wave__surface np-wave__surface--back">
      <path
        d="M-240 44C-200 12-160 12-120 44S-40 76 0 44S80 12 120 44S200 76 240 44S320 12 360 44S440 76 480 44"
      />
    </g>
    <g class="np-wave__surface np-wave__surface--middle">
      <path
        d="M-240 50C-200 27-160 27-120 50S-40 73 0 50S80 27 120 50S200 73 240 50S320 27 360 50S440 73 480 50"
      />
    </g>
    <g class="np-wave__surface np-wave__surface--front">
      <path
        d="M-240 55C-200 35-160 35-120 55S-40 75 0 55S80 35 120 55S200 75 240 55S320 35 360 55S440 75 480 55"
      />
    </g>
  </svg>
  <span class="np-wave__spark np-wave__spark--one"></span>
  <span class="np-wave__spark np-wave__spark--two"></span>
</div>
  <h1 class="startup-title">%VITE_APP_TITLE%</h1>
  <p id="app-loading-message" class="startup-message">正在加载</p>
  <button id="app-loading-retry" class="startup-retry" type="button" hidden>重新加载</button>
</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
